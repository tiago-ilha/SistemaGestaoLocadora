# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: .NET

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GITHUB_CONTAINER_REGISTRY: ghcr.io/${{ github.repository_owner }}/api-sigelo

jobs:
  Release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pre-build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      #- name: Test
      #  run: dotnet test --no-build --verbosity normal

      - name: Generate Image Docker
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 
          docker build -t ${{env.GITHUB_CONTAINER_REGISTRY}}:latest -f ./Sigelo.WebApi/Dockerfile .
          docker tag ${{env.GITHUB_CONTAINER_REGISTRY}}:latest ${{env.GITHUB_CONTAINER_REGISTRY}}:1.0.0
          docker push ${{env.GITHUB_CONTAINER_REGISTRY}}:latest

  Homologacao:
    runs-on: ubuntu-latest
    needs: [Release]
    steps:
      - run: echo "Publicando Homologação"

  Producao:
    runs-on: ubuntu-latest
    needs: [Homologacao]
    environment:
      name: Production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    if: success()
    steps:
      - run: echo "Publicando Produção"
